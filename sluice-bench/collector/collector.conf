#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <time.h>
#include <sys/stat.h>

#define CONFIG_PATH "sluice-bench/collector/collector.conf"
#define OUTPUT_DIR "telemetry"
#define OUTPUT_FILE "telemetry/telemetry_state.json"

// Structure to mirror your exact configuration file metrics matrix layout
typedef struct {
    int data_routing_channel;
    char target_ingress[64];
    char filtration_log_level[32];
    char output_format[16];
    char output_directory[256];
    char payload_stream_name[256];
    int buffer_size_kb;
    int thread_lock_gate;
} CollectorConfig;

// Function to read and parse the configuration file line-by-line
int load_collector_config(CollectorConfig *cfg) {
    FILE *fp = fopen(CONFIG_PATH, "r");
    if (!fp) return 0;

    char line[256];
    while (fgets(line, sizeof(line), fp)) {
        // Strip comment rows and empty lines safely
        if (line[0] == '#' || line[0] == '\n' || line[0] == '\r') continue;

        char key[128], val[128];
        if (sscanf(line, "%[^=]=%s", key, val) == 2) {
            if (strcmp(key, "DATA_ROUTING_CHANNEL") == 0) cfg->data_routing_channel = atoi(val);
            else if (strcmp(key, "TARGET_INGRESS") == 0) strcpy(cfg->target_ingress, val);
            else if (strcmp(key, "FILTRATION_LOG_LEVEL") == 0) strcpy(cfg->filtration_log_level, val);
            else if (strcmp(key, "OUTPUT_FORMAT") == 0) strcpy(cfg->output_format, val);
            else if (strcmp(key, "OUTPUT_DIRECTORY") == 0) strcpy(cfg->output_directory, val);
            else if (strcmp(key, "PAYLOAD_STREAM_NAME") == 0) strcpy(cfg->payload_stream_name, val);
            else if (strcmp(key, "BUFFER_SIZE_KB") == 0) cfg->buffer_size_kb = atoi(val);
            else if (strcmp(key, "THREAD_LOCK_GATE") == 0) cfg->thread_lock_gate = (strcmp(val, "TRUE") == 0) ? 1 : 0;
        }
    }
    fclose(fp);
    return 1;
}

int main() {
    CollectorConfig config;
    
    printf("\n\033[1;34m[MARDUKH COLLECTOR ENGINE ENGINE STARTED]\033[0m\n");
    printf("[BOOT] Parsing environment rule sheets from target: %s\n", CONFIG_PATH);

    // Enforce folder building logic before writing files
    mkdir(OUTPUT_DIR, 0777);

    if (!load_collector_config(&config)) {
        printf("\033[1;31m[ERROR] Unable to read collector.conf specification file. Aborting.\033[0m\n");
        return 1;
    }

    printf("[LOADED] Target Routing Channel Locked: %d\n", config.data_routing_channel);
    printf("[LOADED] Ingress Channel Target: %s\n", config.target_ingress);
    printf("[LOADED] Thread Lock Status: %s\n\n", config.thread_lock_gate ? "ENGAGED" : "DISABLED");

    double base_financial_usd = 48921.40;
    srand(time(NULL));

    printf("\033[1;32m[RUNNING] Initializing continuous data collection loop...\033[0m\n");

    while (1) {
        // Generate simulated fluctuations matching active web view requirements
        int voip_rate = 450 + (rand() % 350);
        int drop_rate = 1 + (rand() % 8);
        base_financial_usd += 0.14;

        // Open file writer stream straight into telemetry folder
        FILE *json_out = fopen(OUTPUT_FILE, "w");
        if (json_out) {
            fprintf(json_out, "{\n");
            fprintf(json_out, "  \"voip_ingress_kbps\": %d,\n", voip_rate);
            fprintf(json_out, "  \"filtration_drop_rate\": %d,\n", drop_rate);
            fprintf(json_out, "  \"financial_gain_usd\": %.2f\n", base_financial_usd);
            fprintf(json_out, "}\n");
            fclose(json_out);

            time_t now;
            time(&now);
            char *ts = ctime(&now);
            ts[strlen(ts) - 1] = '\0'; // Remove newline trailing space cleanly

            printf("[%s] [COLLECTOR] Wrote payload cleanly: VoIP=%dkbps | Drop=%d%%\n", ts, voip_rate, drop_rate);
        } else {
            printf("[CRITICAL ERROR] System storage permission blocked on target location path: %s\n", OUTPUT_FILE);
        }

        sleep(2); // Execute ticks exactly matching the 1500ms frontend request window
    }

    return 0;
}
